/* ═════════════════════════════════════════════════════
   ZAJE L / TYPE & CONTRAST REFINEMENT – high readability
   Text font: Cairo (web CSS), Noto Kufi Arabic / Tahoma fallback.
   Does not alter status semantics, white-on-blue buttons or charts.
   ═════════════════════════════════════════════════════ */
:root {
  --ink: #101e35;
  --muted: #3c4b63;
  --navy: #1b4bc6;
  --text-secondary: #3c4c66;
  --text-tertiary: #51627d;
}
html,body,button,input,select,textarea {
  font-family: 'Cairo','Noto Kufi Arabic',Tahoma,Arial,sans-serif !important;
}
html,body { color: var(--ink); font-weight: 600; -webkit-font-smoothing: auto; text-rendering: optimizeLegibility; }
/* Primary content */
h1,h2,h3,h4,h5,h6,.topbar h1,.h2,.panel-title,.store-title,.task-title,
.ops-card h3,.mk-card-head h3,.mk-leads-top h3,.mk-content-card h3,
.mk-campaign-grid h3,.mk-metric strong,.mk-camp-stats b,.stat .n,
.brand-title,.profile-name,.store-title,.login-card h1,.login-quote h2,
.mk-banner h2,.social-card h4,.social-row strong { color:#152540; font-weight:800; }
/* Muted/secondary text – no faint gray text on white */
.side-label,.brand-sub,.topbar .crumb,.top-note,.profile-role,
.sub,.panel-sub,.stat .k,.stat .extra,.store-sub,.task-meta,
.datatable th,.field label,.tiny,.tag,.sectionbar,
.ops-metric .label,.ops-metric .hint,.ops-caption,.ops-insight,
.ops-footnote,.ops-empty,.ops-why,.ops-badge,
.social-stat small,.social-stat em,.social-row .small-gray,.social-queue-meta,
.social-mini p,.social-empty,.social-pill,
.mk-metric-label,.mk-metric small,.mk-inline-stats,.mk-task small,
.mk-small,.mk-camp-stats,.mk-weekheads span,.mk-day b,
.mk-leads-top p,.mk-empty,.mk-disclaimer,
.login-card p,.login-brand-mark small,.login-quote p,
.social-intro p,.hero p,.mk-copy,.mk-funnel,.mk-content-card p,
.mk-option p,.mk-reason,.mk-next,.mk-camp-stats,
.ops-suggest,.mk-demo,.ops-lead {
 color:#42516b; font-weight:600;
}
/* Menu labels, switches, controls */
.navbtn,.navbtn .count,.social-tabs button,.mk-nav button,
.mk-toolbar label,.chip,.btn.outline,.btn.ghost,.datatable td,
.tab,.mk-tag,.mk-event,.social-pill {
  font-weight:700;
}
.navbtn { color:#344762; }
.navbtn .navicon { color:#365c9c; }
.navbtn.active,.navbtn:hover { color:#174fd2; }
.navbtn.active .navicon { color:#174fd2; }
.sidebar .side-label { color:#40516c; }
.sidebar .helper,.side-bottom .helper {color:#34445e;}
.profile-role,.topbar .crumb { color:#42516b; }
.datatable th,.ops-actiontable th,.smart-table th {color:#3c4c66;font-weight:750;}
.datatable td { color:#1d2f4e; }
.field label {color:#283a56;font-weight:750;}
.input,.select,.textarea {color:#142642;font-weight:600;}
.input::placeholder,.textarea::placeholder,input::placeholder {color:#53627d;opacity:1;}
input:disabled,button:disabled{opacity:.58;}
/* Card and summary labels */
.stat .k,.mk-metric-label{color:#344762;font-weight:700;}
.stat .extra,.mk-metric small,.mk-task small{color:#4b5c75;}
.mk-inline-stats,.mk-camp-stats,.mk-disclaimer{color:#40536d;}
.ops-row .ops-why,.ops-suggest,.mk-reason,.mk-next{color:#314660;}
.tag,.social-pill{color:#27405f;}
/* Banner and filled elements retain light type for accessibility */
.mk-banner,.mk-banner h2,.mk-banner p,.mk-banner .mk-eyebrow,
.mk-banner-icon,.mk-banner *:not(button),
.btn:not(.outline):not(.ghost),.btn:not(.outline):not(.ghost) *,
.navbtn.active .count,.social-tabs button.active,.mk-nav button.active,
.hero .pill,.social-intro h3,.login-right .login-quote h2 span {
  /* Keep their existing branded text color where required; no global !important. */
}
.mk-banner h2,.mk-banner .mk-eyebrow{color:#fff;}
.mk-banner p{color:#f2f6ff;}
.mk-banner-icon{color:#f1f6ff;}
.login-right .login-quote h2{color:#172e58;}
.login-right .login-quote p{color:#354968;}
.login-card .eyebrow{color:#2854a6!important;}
.social-intro h3{color:#1c4087;}
.login-brand-mark strong{font-weight:900;}
/* Better visual hierarchy without oversized type */
.navbtn{font-size:12px;}
.page-head .sub,.panel-sub{font-size:11.5px;}
.mk-metric-label,.stat .k{font-size:11px;}
/* Focus visibility for keyboard navigation */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
 outline:2px solid #245ce4;outline-offset:2px;
}

/* Intentional exceptions */
.hero h2,.hero h2 *{color:#183874;}
.mk-banner h2{color:#fff!important;}
.social-tabs button.active,.mk-nav button.active{color:#fff;}
.mk-nav button.active{color:#1749c4;}
.tag.green,.mk-tag.live{color:#0b7350;}
.tag.red{color:#a63147;}
.tag.orange{color:#945513;}
.mk-event.done{opacity:.8;}

/* --- Red translucent theme + compact horizontal merchant profile rows --- */
:root{
  --navy:#2e1d1d;
  --navy2:#533232;
  --ink:#2b2121;
  --muted:#8e7474;
  --canvas:#fff8f7;
  --white:#ffffff;
  --coral:#c94d45;
  --coralsoft:rgba(201,77,69,.10);
  --green:#1e9a78;
  --border:rgba(201,77,69,.14);
  --shadow:0 12px 32px rgba(145,57,50,.06);
  --radius:18px;
}
html,body{background:var(--canvas)!important;color:var(--ink)!important}
.sidebar,.topbar,.panel,.stat,.ops-section,.template-card,.radar-card,.guide,.login-card,.client-section-card,.client-side-card,.kanban-card,.modal,.drawer,.helperbox,.smart-result,.smart-warning,.callout,.social-card,.mk-card,.mk-camp{border-color:var(--border)!important;box-shadow:var(--shadow)!important}
.sidebar,.topbar,.panel,.stat,.ops-section,.template-card,.radar-card,.guide,.login-card,.client-section-card,.client-side-card,.kanban-card,.modal,.drawer,.helperbox,.smart-result,.callout{background:#fffdfd!important}
.navbtn.active,.chip.active,.btn.coral,.ops-kicker,.eyebrow,.text-link{color:var(--coral)!important}
.navbtn.active,.chip.active{background:rgba(201,77,69,.10)!important;border-color:rgba(201,77,69,.16)!important}
.brand-figure,.avatar,.stat .s-icon,.icon-btn{background:rgba(201,77,69,.08)!important;color:var(--coral)!important}
.btn{background:#402b2b!important}
.btn.coral{background:var(--coral)!important;color:#fff!important}
.btn.outline{background:#fff!important;color:#5a3c3c!important;border:1px solid var(--border)!important}
.btn.ghost{background:rgba(201,77,69,.06)!important;color:#745151!important}
.tag{background:rgba(201,77,69,.08)!important;color:#7a4e4a!important}
.tag.blue{background:rgba(201,77,69,.08)!important;color:#9e433e!important}
.tag.red{background:rgba(201,77,69,.12)!important;color:#b5463f!important}
.tag.orange{background:rgba(227,125,63,.12)!important;color:#a25a28!important}
.hero,.login-right,.client-hero{background:linear-gradient(135deg,#7f2727 0%,#b04138 56%,#d15a52 100%)!important}
.client-drawer{background:#fff8f7!important;border-right:1px solid var(--border)!important}
.client-hero:before,.client-hero:after,.hero:after,.login-right:before{opacity:.55}
.input,.select,.textarea,.task .tick,.smart-result{border-color:rgba(201,77,69,.16)!important}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(201,77,69,.38)!important;box-shadow:0 0 0 3px rgba(201,77,69,.10)!important}
.datatable th,.smart-table th{background:rgba(201,77,69,.04)!important}
.datatable td,.smart-table td,.task,.kpi-pair{border-color:rgba(201,77,69,.10)!important}
.datatable tbody tr:hover,.item-list .item:hover,.kanban-card:hover{background:rgba(201,77,69,.03)!important}
.ops-stage-wrap.expanded,.ops-section,.panel,.client-section-card,.client-side-card{overflow:hidden}

/* Merchant file: stacked horizontal reading rows */
.profile-read-layout{grid-template-columns:1fr!important;gap:14px!important}
.client-main,.client-side{gap:12px!important}
.profile-read-section,.client-side-card{padding:14px 16px 12px!important;border-radius:18px!important}
.client-section-head h3,.client-side-card h3{font-size:13.5px!important;margin:0 0 2px!important}
.client-section-head p,.client-side-card p{font-size:10.5px!important;line-height:1.85!important;color:#896a6a!important}
.profile-read-grid{display:flex!important;flex-direction:column!important;gap:6px!important}
.profile-read-cell{
  display:grid!important;
  grid-template-columns:150px minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:12px!important;
  padding:10px 14px!important;
  background:rgba(201,77,69,.08)!important;
  border:1px solid rgba(201,77,69,.12)!important;
  border-radius:12px!important;

async function addFile(file,mode='rules',options={}){await load();const ext=file.name.split('.').pop().toLowerCase();if(!['pdf','docx','txt'].includes(ext))throw Error('الملفات المسموحة PDF وDOCX وTXT');

async function zkLoad(){try{await ZajelKnowledge.load();zkLoading=false;zkSync();}catch(e){zkLoading=false;try{zkSync()}catch(_){};toast('تعذر تحميل البيانات المحفوظة: '+e.message);}}
window.addEventListener('DOMContentLoaded',zkLoad,{once:true});
window.zkSelect=v=>{zkTab=v;zkEditId='';render()};
window.zkRefreshButton=()=>{zkSync();toast('تم تحديث العرض')};
function zkSetProgress(label,current=0,total=0){const el=document.getElementById('zkProgress');if(!el)return;
 const percent=total?Math.min(100,Math.round(current/total*100)):0;
 el.hidden=false;el.innerHTML=`<div class="zk-progress-meta"><strong>${esc(label)}</strong><span>${total?current+' / '+total+' · '+percent+'%':''}</span></div><div class="zk-progress-track"><span style="width:${percent}%"></span></div>`;
}
window.zkStopWork=()=>{zkCancelRequested=true;zkSetProgress('جارٍ الإيقاف بعد الدفعة الحالية…');};
window.zkUpload=async e=>{
 e.preventDefault();if(!zkAdmin())return toast('رفع الملفات يتطلب صلاحية المدير');
 const f=e.target,files=Array.from(f.querySelector('[name=files]')?.files||[]);
 if(!files.length)return toast('اختر ملفاً أولاً');if(files.length>5)return toast('الحد الأقصى خمسة ملفات في المرة');
 if(zkBusy||zkAnalyzeBusy)return toast('هناك معالجة جارية بالفعل');
 const mode=f.querySelector('[name=analysis_mode]')?.value||'rules';
 zkBusy=true;zkCancelRequested=false;const b=f.querySelector('[type=submit]');if(b)b.disabled=true;
 const stop=document.getElementById('zkCancelWork');if(stop)stop.hidden=false;
 let success=0,errors=[];
 for(const file of files){
  if(zkCancelRequested)break;
  try{zkSetProgress('قراءة: '+file.name,0,0);
   const doc=await ZajelKnowledge.addFile(file,mode,{autoOCR:!!f.querySelector('[name=auto_ocr]')?.checked,onProgress:p=>zkSetProgress((p.phase==='ocr'?'OCR للصفحات المصوّرة: ':'استخراج صفحات: ')+file.name,p.current,p.total),shouldCancel:()=>zkCancelRequested});
   success++;zkSelectedDoc=doc.id;zkRangeFrom=1;zkRangeTo=Math.min(12,doc.page_count);if(doc.ocr_warning||doc.ocr_storage_warning)errors.push(file.name+': '+[doc.ocr_warning,doc.ocr_storage_warning].filter(Boolean).join(' | '));
  }catch(err){errors.push(file.name+': '+err.message);}
 }
 zkBusy=false;if(b)b.disabled=false;if(stop)stop.hidden=true;
 if(success){f.reset();toast('حُفظ '+success+' ملف. يمكنك اختيار صفحات أو تحليل الكتاب كاملاً.');}
 for(const err of errors)toast(err);
 zkSync();
};
window.zkChooseDoc=id=>{const d=zkData.documents.find(x=>x.id===id);if(!d)return;
 zkSelectedDoc=id;zkRangeFrom=1;zkRangeTo=Math.min(12,d.page_count);render();document.getElementById('zkAnalysisControls')?.scrollIntoView({behavior:'smooth',block:'center'});
};
window.zkQuickRange=size=>{const d=zkData.documents.find(x=>x.id===zkSelectedDoc);if(!d)return;
 const from=document.getElementById('zkStartPage'),to=document.getElementById('zkEndPage');
 if(!from||!to)return;const start=Math.max(1,Math.min(d.page_count,Number(from.value)||1));from.value=start;to.value=Math.min(d.page_count,start+size-1);zkRangeFrom=start;zkRangeTo=Number(to.value);
};
window.zkNextRange=()=>{const d=zkData.documents.find(x=>x.id===zkSelectedDoc);if(!d)return;
 const from=document.getElementById('zkStartPage'),to=document.getElementById('zkEndPage');if(!from||!to)return;
 const prevFrom=Number(from.value)||1,prevTo=Number(to.value)||12,size=Math.max(1,prevTo-prevFrom+1);
 if(prevTo>=d.page_count)return toast('وصلت إلى آخر صفحة');from.value=prevTo+1;to.value=Math.min(d.page_count,prevTo+size);zkRangeFrom=Number(from.value);zkRangeTo=Number(to.value);
};
window.zkOCRRange=async(id)=>{
 if(!zkAdmin())return toast('قراءة OCR تتطلب صلاحية المدير');
 if(zkBusy||zkAnalyzeBusy)return toast('هناك عملية أخرى جارية');
 const doc=zkData.documents.find(d=>d.id===id);if(!doc||!doc.filename.toLowerCase().endsWith('.pdf'))return toast('اختر PDF أولاً');
 const from=Number(document.getElementById('zkStartPage')?.value),to=Number(document.getElementById('zkEndPage')?.value);
 if(!Number.isInteger(from)||!Number.isInteger(to)||from<1||to<from||to>doc.page_count)return toast('تحقق من رقم البداية والنهاية');
 const localFile=document.getElementById('zkOCRSource')?.files?.[0]||null;
 zkRangeFrom=from;zkRangeTo=to;zkBusy=true;zkCancelRequested=false;
 const stop=document.getElementById('zkCancelWork');if(stop)stop.hidden=false;
 document.querySelectorAll('.zk-analysis-actions button').forEach(b=>b.disabled=true);
 try{
  zkSetProgress('تهيئة محرك OCR العربي؛ قد يحتاج تنزيل الملفات أول مرة…',0,to-from+1);
  const result=await ZajelKnowledge.ocrDocument(id,{startPage:from,endPage:to,file:localFile,retry:!!document.getElementById('zkOCRRetry')?.checked,shouldCancel:()=>zkCancelRequested,onProgress:p=>zkSetProgress('OCR للصفحة '+p.lastPage+' — تم التعرف على '+(p.recognized||0)+' صفحة',p.current,p.total)});
  const cancelled=zkCancelRequested||result.cancelled;
  zkSetProgress('اكتملت قراءة '+result.processed+' صفحة OCR. يتم استخراج الأفكار…',result.processed,result.processed);
  let ideas=0;if(!cancelled){try{ideas=await ZajelKnowledge.analyze(id,{language:document.getElementById('zkLanguage')?.value||'iq',trade:document.getElementById('zkTrade')?.value||'الكل',stage:document.getElementById('zkStage')?.value||'مؤهل',variants:Number(document.getElementById('zkVariants')?.value||2),objection:document.getElementById('zkObjection')?.value||'',startPage:from,endPage:to,shouldCancel:()=>zkCancelRequested,onProgress:p=>zkSetProgress('تحليل النص المستخرج · أفكار جديدة: '+p.ideas,p.current,p.total)});}catch(e){if(!/هذه الصفحات مصوّرة/.test(e.message))throw e;}}
  zkSync();toast((cancelled?'تم إيقاف OCR، وحُفظ ما اكتمل. ':'')+'OCR: '+result.recognized+' صفحة مقروءة، '+result.failed+' صفحة متعذرة، '+ideas+' فكرة جديدة.');
 }catch(err){zkSync();toast('تعذر OCR: '+err.message);}finally{zkBusy=false;zkCancelRequested=false;const btn=document.getElementById('zkCancelWork');if(btn)btn.hidden=true;document.querySelectorAll('.zk-analysis-actions button').forEach(b=>b.disabled=false);zkSync();}
};
window.zkAnalyze=async(id,entire=false)=>{
 if(!zkAdmin())return toast('التحليل يتطلب صلاحية المدير');
 if(zkBusy||zkAnalyzeBusy)return toast('هناك معالجة جارية بالفعل');
 const doc=zkData.documents.find(d=>d.id===id);if(!doc)return toast('اختر ملفاً أولاً');
 const from=entire?1:Number(document.getElementById('zkStartPage')?.value);
 const to=entire?doc.page_count:Number(document.getElementById('zkEndPage')?.value);
 if(!Number.isInteger(from)||!Number.isInteger(to)||from<1||to<from||to>doc.page_count)return toast('تحقق من أرقام الصفحات: من 1 إلى '+doc.page_count);
 if(!entire){zkRangeFrom=from;zkRangeTo=to;}
 const opts={language:document.getElementById('zkLanguage')?.value||'iq',trade:document.getElementById('zkTrade')?.value||'الكل',stage:document.getElementById('zkStage')?.value||'مؤهل',
  objection:document.getElementById('zkObjection')?.value||'',variants:Number(document.getElementById('zkVariants')?.value||2),startPage:from,endPage:to,
  onProgress:p=>zkSetProgress('تحليل الصفحات '+from+'–'+to+' · أفكار جديدة: '+p.ideas,p.current,p.total),shouldCancel:()=>zkCancelRequested};
 zkAnalyzeBusy=true;zkCancelRequested=false;
 const stop=document.getElementById('zkCancelWork');if(stop)stop.hidden=false;
 document.querySelectorAll('.zk-analysis-actions button').forEach(b=>b.disabled=true);
 zkSetProgress('بدء تحليل الصفحات '+from+'–'+to,0,to-from+1);
 try{const count=await ZajelKnowledge.analyze(id,opts);
  const stopped=zkCancelRequested;zkSync();toast(stopped?'توقف التحليل. تم حفظ '+count+' فكرة جديدة ويمكنك استكماله.':count?'تم استخراج '+count+' فكرة جديدة؛ راجع تبويب الأفكار والمسودات.':'هذا النطاق محلّل سابقاً أو لم تطابق صفحاته قواعد التسويق.');
 }catch(err){zkSync();toast(err.message);}finally{zkAnalyzeBusy=false;zkCancelRequested=false;const btn=document.getElementById('zkCancelWork');if(btn)btn.hidden=true;document.querySelectorAll('.zk-analysis-actions button').forEach(b=>b.disabled=false);zkSync();}
};
window.zkCopyImportGuide=()=>{
 const s='حلّل ملف الكتاب المرفق في ChatGPT واستخرج أفكاراً تسويقية مناسبة لتجار زاجل في السوق العراقي. أعد JSON صالحاً فقط بالشكل {"insights":[{"page_no":1,"idea":"مبدأ تسويقي محدد مرتبط بصفحة حقيقية","messages":["رسالة تسويقية أصلية طويلة ومناسبة لتاجر عراقي من دون أي وعد تشغيلي غير موثق"]}]}. استخدم أرقام صفحات PDF الفعلية، أو أرقام مقاطع Word/TXT. لا تنسخ فقرات طويلة ولا تختلق معلومات عن خدمات زاجل.';
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('نُسخت تعليمات التحليل')).catch(()=>toast('تعذر النسخ التلقائي'));else toast('يرجى نسخ المثال يدوياً');
};
window.zkImportAnalysis=async e=>{
 e.preventDefault();if(!zkAdmin())return toast('الاستيراد يحتاج صلاحية المدير');
 const f=e.target,id=f.querySelector('[name=document_id]')?.value;let data;
 try{data=JSON.parse(f.querySelector('[name=analysis_json]')?.value||'');}catch(err){return toast('صيغة JSON غير صحيحة')}
 if(Array.isArray(data))data={insights:data};if(!data||!Array.isArray(data.insights))return toast('يجب أن يحتوي JSON على insights');
 data.language=f.querySelector('[name=language]')?.value;data.trade=f.querySelector('[name=trade]')?.value;data.stage=f.querySelector('[name=stage]')?.value;
 try{const r=await ZajelKnowledge.importInsights(id,data);zkSync();toast('استُوردت '+r.ideas+' فكرة و'+r.drafts+' رسالة للمراجعة');f.reset();}catch(err){toast(err.message)}
};
window.zkShowPages=id=>{zkPagesDoc=id;zkPreviewStart=1;render();};
window.zkPreviewStep=n=>{const count=(zkData.pages[zkPagesDoc]||[]).length;zkPreviewStart=Math.max(1,Math.min(Math.max(1,count-19),zkPreviewStart+n));render();};
window.zkHidePages=()=>{zkPagesDoc='';zkPages=[];render()};
window.zkSetDraftFilter=v=>{zkFilter=v;zkEditId='';zkDraftsOffset=0;render()};
window.zkIdeasPage=n=>{zkIdeasOffset=Math.max(0,zkIdeasOffset+n*40);render();};
window.zkDraftsPage=n=>{zkDraftsOffset=Math.max(0,zkDraftsOffset+n*30);render();};
window.zkEdit=id=>{zkEditId=id;zkTab='drafts';render()};
window.zkCancelEdit=()=>{zkEditId='';render()};
window.zkSaveDraft=async e=>{
 e.preventDefault();if(!zkAdmin())return toast('تعديل الرسائل يتطلب صلاحية المدير');
 const f=new FormData(e.target),c=assigned().find(c=>c.id===f.get('merchant_id'));
 try{await ZajelKnowledge.updateDraft(zkEditId,{text:String(f.get('text')||'').trim(),trade:f.get('trade'),stage:f.get('stage'),objection:f.get('objection'),merchant_id:c?.id||'',merchant_name:c?.name||''});zkEditId='';zkSync();toast('حُفظ التعديل، وأعيدت الرسالة إلى انتظار الاعتماد');}catch(err){toast(err.message)}
};
window.zkApprove=async id=>{if(!zkAdmin())return toast('الاعتماد يحتاج صلاحية المدير');try{await ZajelKnowledge.review(id,'approved');zkSync();toast('تم اعتماد الرسالة');}catch(e){toast(e.message)}};
window.zkReject=async id=>{if(!zkAdmin())return toast('الرفض يحتاج صلاحية المدير');try{await ZajelKnowledge.review(id,'rejected');zkSync();toast('تم رفض الرسالة');}catch(e){toast(e.message)}};
window.zkSaveFacts=async e=>{e.preventDefault();if(!zkAdmin())return;try{await ZajelKnowledge.saveFacts(e.target.querySelector('textarea')?.value||'');zkSync();toast('حُفظت الحقائق المعتمدة');}catch(err){toast(err.message)}};
window.zkDeleteDocument=async id=>{if(!zkAdmin())return toast('الحذف يتطلب صلاحية المدير');if(!confirm('حذف الملف وكل أفكاره ومسوداته نهائياً من هذا المتصفح؟'))return;
 try{await ZajelKnowledge.removeDocument(id);if(zkPagesDoc===id)zkHidePages();zkSync();toast('تم حذف الملف ونتائجه');}catch(e){toast(e.message)}};
window.zkExport=()=>{if(!zkAdmin())return toast('التصدير يتطلب المدير');
 const b=new Blob([ZajelKnowledge.exportBackup()],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='Zajel_Knowledge_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
};
window.zkImportBackup=async e=>{const file=e.target.files?.[0];if(!file)return;if(!zkAdmin())return toast('استعادة النسخة تتطلب المدير');
 if(file.size>12*1024*1024)return toast('النسخة الاحتياطية كبيرة جداً');if(!confirm('ستحل هذه النسخة محل بيانات مكتبة المعرفة الحالية على هذا المتصفح. متابعة؟'))return;
 try{await ZajelKnowledge.importBackup(await file.text());zkSync();toast('تمت استعادة مكتبة المعرفة من النسخة الاحتياطية');}catch(err){toast(err.message)}e.target.value='';};
window.zkImportToCRM=id=>{
 if(!zkAdmin()||!zjuCan('templatesEdit'))return toast('إضافة القوالب تتطلب صلاحية المدير');
 const d=zkFindDraft(id);if(!d||d.status!=='approved')return toast('اعتمد الرسالة قبل إضافتها إلى CRM');
 const templateId='zk_'+id;if(DB.templates.some(t=>t.id===templateId))return toast('هذه الرسالة موجودة مسبقاً في القوالب');
 DB.templates.push({id:templateId,category:'معرفة ذكية • '+d.trade,title:'فكرة: '+String(d.idea||'').slice(0,60),text:d.text,
 sourceFile:d.filename,sourcePage:d.page_no,knowledgeDraftId:d.id,stage:d.stage});save();log('إضافة رسالة معتمدة من مكتبة المعرفة '+d.filename);toast('أُضيفت إلى قوالب CRM على هذا المتصفح');
};
window.zkOpenWA=id=>{
 const d=zkFindDraft(id);if(!d||d.status!=='approved')return toast('الرسالة غير معتمدة');
 if(!zjuAllow('whatsapp'))return;const c=assigned().find(c=>c.id===d.merchant_id);
 if(!c)return toast('اربط الرسالة بملف تاجر أولاً');if(!rejApproved(c))return toast('يلزم توثيق موافقة التاجر التسويقية قبل فتح واتساب');
 const n=waNumber(c.phone);if(!/^9647\d{9}$/.test(n))return toast('رقم هاتف التاجر غير صالح');
 window.open(waUrl(c,d.text),'_blank','noopener,noreferrer');log('فتح مسودة واتساب من مكتبة المعرفة للتاجر '+c.name);toast('تم فتح مسودة واتساب، ولن تُرسل تلقائياً');
};

 const traders=assigned();return `<form class="zk-editor" onsubmit="zkSaveDraft(event)">

 <div class="field"><label>نص الرسالة</label><textarea class="textarea" name="text" rows="5" maxlength="1700" required>${esc(d.text)}</textarea></div>
 <div class="zk-form-grid"><div class="field"><label>نوع التجارة</label><select name="trade" class="select">${zkOptionList([...new Set([...zkTradeOptions,d.trade])],d.trade)}</select></div>
 <div class="field"><label>مرحلة البيع</label><select name="stage" class="select">${zkOptionList(zkStageOptions,d.stage)}</select></div>

 <div class="zk-actions"><button class="btn coral" type="submit">حفظ وإعادة المراجعة</button></div></form>`;}
function zkDocuments(){
 const selected=zkData.documents.find(d=>d.id===zkSelectedDoc)||zkData.documents[0];if(selected&&!zkSelectedDoc)zkSelectedDoc=selected.id;
 if(selected&&zkSelectedDoc!==selected.id){zkSelectedDoc=selected.id;zkRangeFrom=1;zkRangeTo=Math.min(12,selected.page_count);}const pageCount=selected?.page_count||0;
 return `<div class="zk-block"><div class="zk-headline"><h3>رفع الكتب والملفات الكبيرة</h3><span>PDF وDOCX وTXT · حتى 200MB · حتى 3000 صفحة</span></div>
 ${zkAdmin()?`<form onsubmit="zkUpload(event)" class="zk-upload">
 <div class="field"><label>اختر ملفاً أو أكثر (حتى 5 في العملية)</label><input class="input" type="file" name="files" accept=".pdf,.docx,.txt" multiple required></div>
 <div class="field"><label>طريقة المعالجة عند الرفع</label><select class="select" name="analysis_mode">
 <option value="rules">استخراج الكتاب وتحليل أول 12 صفحة، ثم يمكنك تحليل أي نطاق أو الكتاب كاملاً</option>
 <option value="import">استخراج النص ثم استيراد تحليل ChatGPT يدوياً</option>
 <option value="extract">استخراج النص فقط دون إنشاء مسودات</option></select>
 <label class="zk-checkline"><input type="checkbox" name="auto_ocr" checked> محاولة قراءة أول 12 صفحة مصوّرة تلقائياً بخاصية OCR عند الرفع</label><small class="zk-help">يدعم الكتب المصوّرة بالعربية والإنجليزية. يقرأ النص الموجود مباشرة، ويحاول OCR للصور؛ بعد ذلك يمكنك قراءة أي نطاق. أول تشغيل لـ OCR يحتاج إنترنت لتنزيل المحرك ولغات التعرف، ثم تتم القراءة داخل جهازك دون إرسال صور الكتاب إلى خدمة تحليل.</small></div>
 <button type="submit" class="btn coral" ${zkBusy||zkAnalyzeBusy?'disabled':''}>${ic('plus')} ${zkBusy?'جارٍ استخراج صفحات الكتاب...':'رفع الكتاب أو الملفات'}</button></form>`:'<div class="notice">رفع الملفات وإدارتها متاحان لحساب المدير.</div>'}
 <div id="zkProgress" class="zk-progress" role="status" aria-live="polite" hidden></div>
 ${zkAdmin()?`<button id="zkCancelWork" class="btn outline small" onclick="zkStopWork()" hidden>إيقاف العملية بعد الدفعة الحالية</button>`:''}
 <div class="zk-headline"><h3>الكتب والملفات المحفوظة</h3><span>${zkData.documents.length} ملف في هذا المتصفح</span></div>
 <div class="zk-file-list">${zkData.documents.map(doc=>`<div class="zk-file">
 <div class="zk-file-heading"><span class="zk-fileicon">${ic('file')}</span><div><strong>${esc(doc.filename)}</strong><small>${zkDate(doc.created_at)} · ${doc.page_count||0} ${doc.filename.toLowerCase().endsWith('.pdf')?'صفحة':'مقطع'}</small></div></div>
 ${zkTag(doc.status)}${doc.filename.toLowerCase().endsWith('.pdf')?`<small class="zk-help">OCR: ${doc.ocr_pages||0} صفحة · ${doc.unread_pages||0} صفحات قليلة النص / مصوّرة · ${doc.source_cached?'الأصل محفوظ محلياً':'قد تحتاج اختيار PDF الأصلي عند OCR'}</small>`:''}<div class="zk-actions"><button type="button" class="btn outline small" onclick="zkShowPages('${doc.id}')">تصفّح المصدر</button>
 ${zkAdmin()?`<button type="button" class="btn ${selected?.id===doc.id?'coral':'outline'} small" onclick="zkChooseDoc('${doc.id}')">${selected?.id===doc.id?'محدد للتحليل':'اختيار للتحليل'}</button><button type="button" class="btn ghost small" onclick="zkDeleteDocument('${doc.id}')">حذف</button>`:''}</div>
 ${doc.error?`<div class="zk-error">${esc(doc.error)}</div>`:''}${doc.ocr_warning?`<small class="zk-help">${esc(doc.ocr_warning)}</small>`:''}${doc.ocr_storage_warning?`<small class="zk-help">${esc(doc.ocr_storage_warning)}</small>`:''}</div>`).join('')||'<div class="zk-empty">لم تُرفع أي ملفات بعد. اختر PDF أو Word أو TXT من الأعلى للبدء.</div>'}</div>
 ${zkAdmin()&&selected?`<div id="zkAnalysisControls" class="zk-analysis-controls">
 <div class="zk-headline" style="margin-top:25px"><h3>تحليل نطاق من الكتاب أو الكتاب كاملاً</h3><span>الملف: ${esc(selected.filename)} — ${pageCount} صفحة / مقطع</span></div>
 <div class="zk-form-grid zk-generation">
 <div class="field"><label>من الصفحة</label><input type="number" class="input" id="zkStartPage" min="1" max="${pageCount}" step="1" value="${Math.min(pageCount,Math.max(1,zkRangeFrom))}"></div>
 <div class="field"><label>إلى الصفحة</label><input type="number" class="input" id="zkEndPage" min="1" max="${pageCount}" step="1" value="${Math.min(pageCount,Math.max(1,zkRangeTo))}"></div>
 <div class="field zk-wide"><label>تحديد سريع لنطاق الصفحات بدءاً من رقم «من الصفحة»</label><div class="zk-range-shortcuts">
 ${[12,25,50,100].map(n=>`<button type="button" class="btn outline small" onclick="zkQuickRange(${n})">${n} صفحة</button>`).join('')}
 <button type="button" class="btn outline small" onclick="zkNextRange()">الدفعة التالية ←</button></div></div>
 <div class="field"><label>اللغة</label><select class="select" id="zkLanguage"><option value="iq">لهجة عراقية</option><option value="ar">عربية فصحى</option></select></div>
 <div class="field"><label>نوع التجارة</label><select class="select" id="zkTrade">${zkOptionList(zkTradeOptions,'الكل')}</select></div>
 <div class="field"><label>مرحلة التاجر</label><select class="select" id="zkStage">${zkOptionList(zkStageOptions,'مؤهل')}</select></div>
 <div class="field"><label>عدد الرسائل لكل فكرة</label><select class="select" id="zkVariants"><option value="2">2</option><option value="1">1</option></select></div>
 <div class="field zk-wide"><label>الاعتراض المستهدف</label><input id="zkObjection" class="input" placeholder="مثلاً: مرتاح مع شركة التوصيل الحالية" maxlength="180"></div></div>
 ${selected.filename.toLowerCase().endsWith('.pdf')?`<div class="zk-ocr-box"><strong>قراءة صفحات PDF المصوّرة (OCR)</strong><p>يحوّل صور صفحات PDF المختارة إلى نص عربي/إنجليزي ثم يستخرج الأفكار. يتجاوز الصفحات النصية والمقروءة سابقاً، ويحفظ التقدم كل 3 صفحات. للكتب الكبيرة اختر 12–25 صفحة في كل دفعة لتجنّب إجهاد الجهاز.</p><label class="zk-help" for="zkOCRSource">ملف PDF الأصلي (اختياري إذا كان محفوظاً في هذا المتصفح، إلزامي للكتب المرفوعة قبل التحديث)</label><input id="zkOCRSource" type="file" class="input" accept=".pdf,application/pdf"><label class="zk-checkline"><input type="checkbox" id="zkOCRRetry"> إعادة محاولة OCR للصفحات التي لم يظهر نص كافٍ فيها سابقاً</label><div class="zk-actions"><button type="button" class="btn coral" onclick="zkOCRRange('${selected.id}')">قراءة OCR للنطاق ثم تحليل الأفكار</button></div></div>`:''}
 <div class="zk-analysis-actions zk-actions"><button type="button" class="btn coral" onclick="zkAnalyze('${selected.id}',false)">تحليل الصفحات المحددة</button>
 <button type="button" class="btn outline" onclick="zkAnalyze('${selected.id}',true)">تحليل الكتاب كاملاً (${pageCount} صفحة)</button></div>
 <small class="zk-help">عند تحليل الكتاب كاملاً، تتم المعالجة بالتتابع كل 20 صفحة مع حفظ الأفكار بعد كل دفعة؛ يمكنك الإيقاف ثم إعادة التحليل دون تكرار الأفكار القديمة.</small>
 </div>`:''}
 ${zkPagesDoc?`<div class="zk-pages"><div class="zk-headline"><h3>معاينة النص — ${esc(zkData.documents.find(d=>d.id===zkPagesDoc)?.filename||'')}</h3>
 <div class="zk-actions"><button class="btn outline small" onclick="zkPreviewStep(-20)" ${zkPreviewStart===1?'disabled':''}>السابق</button>
 <span>${zkPreviewStart}–${Math.min((zkData.pages[zkPagesDoc]||[]).length,zkPreviewStart+19)} من ${(zkData.pages[zkPagesDoc]||[]).length}</span>
 <button class="btn outline small" onclick="zkPreviewStep(20)" ${zkPreviewStart+19>=(zkData.pages[zkPagesDoc]||[]).length?'disabled':''}>التالي</button>
 <button class="btn outline small" onclick="zkHidePages()">إغلاق</button></div></div>
 ${(zkData.pages[zkPagesDoc]||[]).slice(zkPreviewStart-1,zkPreviewStart+19).map(p=>`<article class="zk-page"><strong>${(p.method?.startsWith('PDF')||p.method?.startsWith('OCR'))?'صفحة':'مقطع'} ${p.page_no} · ${esc(p.method||'نص')} ${p.ocr_confidence!==undefined?' · مؤشر OCR: '+Number(p.ocr_confidence)+'%':''}</strong><p>${esc(p.text?.slice(0,900)||'لا يوجد نص قابل للاستخراج')}</p></article>`).join('')}</div>`:''}
 </div>`;
}
function zkIdeas(){return `<div class="zk-block"><div class="zk-headline"><h3>الأفكار والمبادئ المستخرجة</h3><span>كل فكرة مرتبطة بالصفحة أو المقطع</span></div>
 <div class="zk-ideas">${zkData.ideas.slice(zkIdeasOffset,zkIdeasOffset+40).map(i=>`<article class="zk-idea"><div class="zk-eyebrow">${esc(i.filename)} · ${i.filename.toLowerCase().endsWith('.pdf')?'صفحة':'مقطع'} ${Number(i.page_no)}</div>
 <h3>${esc(i.idea)}</h3><div class="zk-chips"><span>${i.origin==='rules'?'تصنيف بالكلمات والقواعد (محدود)':'تحليل مستورد يدوياً — راجع المصدر'}</span></div>
 <div class="zk-source"><strong>مقتطف مرجعي:</strong><p>${esc(i.excerpt||'غير متاح')}</p></div></article>`).join('')||'<div class="zk-empty">لا توجد أفكار بعد. ارفع ملفاً أو استورد تحليلاً جاهزاً.</div>'}</div>${zkPager(zkData.ideas.length,zkIdeasOffset,40,'zkIdeasPage')}</div>`;}
function zkPager(total,offset,perPage,fn){if(total<=perPage)return '';return `<div class="zk-page-nav"><span>النتائج ${Math.min(offset+1,total)}–${Math.min(offset+perPage,total)} من ${total}</span><button class="btn outline small" onclick="${fn}(-1)" ${offset<=0?'disabled':''}>السابق</button><button class="btn outline small" onclick="${fn}(1)" ${offset+perPage>=total?'disabled':''}>التالي</button></div>`;}
function zkDrafts(){const filtered=zkData.drafts.filter(d=>zkFilter==='all'||d.status===zkFilter);
 return `<div class="zk-block"><div class="zk-headline"><h3>مسودات الرسائل التسويقية</h3><select class="select" aria-label="تصفية المسودات" onchange="zkSetDraftFilter(this.value)">
 ${[['all','كل الرسائل'],['pending','بانتظار الاعتماد'],['approved','معتمدة'],['rejected','مرفوضة']].map(([k,v])=>`<option value="${k}" ${zkFilter===k?'selected':''}>${v}</option>`).join('')}</select></div>
 ${zkEditor()}<div class="zk-drafts">${filtered.slice(zkDraftsOffset,zkDraftsOffset+30).map(d=>`<article class="zk-draft"><div class="zk-draft-top"><div>${zkTag(d.status)}<span class="zk-lang">${d.language==='iq'?'عراقية':'فصحى'}</span></div>
 <small>${esc(d.filename)} · ${d.filename.toLowerCase().endsWith('.pdf')?'صفحة':'مقطع'} ${Number(d.page_no)}</small></div>
 <p class="zk-message">${esc(d.text)}</p><div class="zk-idea-ref">الفكرة: ${esc(d.idea)}</div>
 <div class="zk-chips"><span>${d.origin==='rules'?'صياغة بالقواعد':'تحليل مستورد يدوياً'}</span><span>التجارة: ${esc(d.trade)}</span><span>المرحلة: ${esc(d.stage)}</span>${d.objection?`<span>الاعتراض: ${esc(d.objection)}</span>`:''}${d.merchant_name?`<span>التاجر: ${esc(d.merchant_name)}</span>`:''}</div>
 ${d.warning?`<div class="zk-error">${esc(d.warning)} — عدّل النص قبل الاعتماد.</div>`:''}
 <div class="zk-actions">${zkAdmin()?`<button class="btn outline small" onclick="zkEdit('${d.id}')">${ic('file')} تعديل وربط</button>`:''}
 ${zkAdmin()&&d.status!=='approved'?`<button class="btn coral small" ${d.warning?'disabled':''} onclick="zkApprove('${d.id}')">اعتماد المدير</button>`:''}
 ${zkAdmin()&&d.status!=='rejected'?`<button class="btn ghost small" onclick="zkReject('${d.id}')">رفض</button>`:''}
 ${d.status==='approved'?`<button class="btn outline small" onclick="zkImportToCRM('${d.id}')">إضافة إلى قوالب CRM</button><button class="btn green small" onclick="zkOpenWA('${d.id}')">فتح واتساب</button>`:''}</div>
 </article>`).join('')||'<div class="zk-empty">لا توجد مسودات مطابقة. ارفع ملفاً ثم حلّله بالقواعد أو استورد أفكار ChatGPT.</div>'}</div>${zkPager(filtered.length,zkDraftsOffset,30,'zkDraftsPage')}</div>`;}
function zkImportPanel(){const docs=zkData.documents.filter(d=>d.status==='ready');return `<div class="zk-block"><div class="zk-headline"><h3>استيراد تحليل من ChatGPT دون API</h3><span>نسخ ولصق يدوي فقط</span></div>
 <p class="zk-muted">ارفع نفس الملف في ChatGPT داخل دردشة مستقلة، ثم اطلب منه إرجاع الأفكار بصيغة JSON. انسخ النتيجة والصقها أدناه؛ لا يرسل زاجل ملفاتك أو معلوماتك إلى ChatGPT تلقائياً.</p>
 <div class="zk-steps"><span>1. ارفع الملف إلى المكتبة</span><span>2. حلّل نسخته في ChatGPT</span><span>3. الصق JSON</span><span>4. راجع واعتمد</span></div>
 <button class="btn outline small" onclick="zkCopyImportGuide()">نسخ التعليمات الجاهزة لـ ChatGPT</button>
 ${zkAdmin()?`<form class="zk-import-form" onsubmit="zkImportAnalysis(event)"><div class="zk-form-grid">
 <div class="field"><label>الملف المرجعي</label><select class="select" name="document_id" required>${docs.map(d=>`<option value="${esc(d.id)}">${esc(d.filename)}</option>`).join('')}</select></div>
 <div class="field"><label>لغة الرسائل</label><select class="select" name="language"><option value="iq">لهجة عراقية</option><option value="ar">عربية فصحى</option></select></div>
 <div class="field"><label>نوع التجارة</label><select class="select" name="trade">${zkOptionList(zkTradeOptions,'الكل')}</select></div>
 <div class="field"><label>مرحلة التاجر</label><select class="select" name="stage">${zkOptionList(zkStageOptions,'مؤهل')}</select></div>
 <div class="field zk-wide"><label>نتيجة التحليل JSON</label><textarea class="textarea zk-json" name="analysis_json" dir="ltr" rows="8" spellcheck="false" required placeholder='{"insights":[{"page_no":1,"idea":"مبدأ تسويقي مرتبط بالصفحة","messages":["شنو أكثر نقطة تهمك عند اختيار شريك التوصيل لمتجرك؟ يهمنا نعرف احتياجاتك ونناقشها قبل أي قرار."]}]}'></textarea></div></div>
 <p class="zk-help">لكل فكرة: رقم الصفحة page_no، وصف الفكرة idea، ورسالة إلى ثلاث في messages. الحد 30 فكرة لكل عملية. في ملفات PDF المصوّرة راجع رقم الصفحة يدوياً.</p>
 <button type="submit" class="btn coral" ${docs.length?'':'disabled'}>استيراد الأفكار للمراجعة</button></form>`:'<div class="notice">استيراد الأفكار يحتاج صلاحية المدير.</div>'}
 <div class="zk-notice">لا يُعتمد التحليل المستورد تلقائياً. راجع النص المرجعي والادعاءات والأسعار والخدمات قبل اعتماد أي رسالة.</div></div>`;}
function zkSettings(){return `<div class="zk-block"><h3>حقائق زاجل المعتمدة</h3>
 <p class="zk-muted">دوّن المعلومات التي تحققت منها الإدارة. التحليل بالقواعد لا يخترع مزايا أو أرقاماً، والحقائق تساعدك عند مراجعة مسودات ChatGPT يدوياً.</p>
 ${zkAdmin()?`<form onsubmit="zkSaveFacts(event)"><div class="field"><label>حقائق الشركة</label><textarea class="textarea" rows="6" maxlength="4000" placeholder="مثلاً: الخدمات المثبتة فقط، دون أرقام أو وعود غير معتمدة">${esc(zkData.facts||'')}</textarea></div><button class="btn coral" type="submit">حفظ الحقائق</button></form>
 <div class="zk-backup-tools"><button class="btn outline small" type="button" onclick="zkExport()">تصدير نسخة احتياطية JSON</button><label class="btn outline small zk-backup-label">استعادة نسخة احتياطية<input type="file" accept="application/json,.json" onchange="zkImportBackup(event)" hidden></label></div>`:''}
 <div class="zk-notice">النسخة الاحتياطية JSON لا تحتوي ملفات PDF الأصلية؛ بعد الاستعادة أعد اختيار PDF الأصلي إذا أردت OCR لصفحات أخرى. التخزين داخل هذا المتصفح باستخدام IndexedDB (وقد يُستخدم localStorage كبديل). لا تُشارك البيانات بين الأجهزة، وقد تُفقد بمسح بيانات الموقع. صدّر نسخة احتياطية بانتظام. هذا ليس نظام دخول آمن متعدد المستخدمين.</div>
 <div class="zk-notice">الحقوق: ارفع الملفات التي يحق لك تحليلها، وتجنب تضمين معلومات حساسة داخل تحليلات خارجية دون موافقة.</div></div>`;}
function knowledgePage(){return `${sectionHeader('مكتبة المعرفة التسويقية الذكية','رفع ملفات التسويق واستخراج أفكار ورسائل قابلة للمراجعة دون أي ربط ذكاء اصطناعي.')}
 <div class="zk-page-root" dir="rtl">
 <div class="zk-top"><div class="zk-top-title"><span class="zk-eyebrow">ZAJEL CRM · MARKETING KNOWLEDGE LIBRARY</span>
 <h2>من الكتب إلى أفكار ورسائل تسويقية للسوق العراقي</h2><p>رفع PDF مصوّر أو نصّي وWord وTXT → OCR عربي/إنجليزي عند الحاجة → قواعد تسويقية أو استيراد ChatGPT → مراجعة المدير.</p></div>
 <div class="zk-state"><span class="zk-online">يعمل داخل المتصفح · دون ربط خدمة</span></div></div>
 <div class="zk-statusbar"><span>طريقة التحليل: <b>قواعد تسويقية محلية</b></span><span>ChatGPT: <b>استيراد يدوي فقط</b></span>
 <span>التخزين: <b>هذا المتصفح</b></span><span>الصلاحية: <b>${zkAdmin()?'مدير':'عرض فقط'}</b></span>
 <button class="btn outline small" onclick="zkRefreshButton()">تحديث</button></div>
 <div class="zk-kpis"><div><b>${zkData.overview.documents||0}</b><span>ملفات</span></div><div><b>${zkData.overview.ideas||0}</b><span>أفكار</span></div><div><b>${zkData.overview.drafts||0}</b><span>مسودات</span></div><div><b>${zkData.overview.approved||0}</b><span>رسائل معتمدة</span></div></div>
 <div class="zk-tabs">${[['documents','الملفات والتحليل'],['ideas','الأفكار والمصادر'],['drafts','مسودات الرسائل'],['import','استيراد ChatGPT'],['settings','حقائق زاجل والنسخ']].map(([id,label])=>`<button type="button" class="${zkTab===id?'active':''}" onclick="zkSelect('${id}')">${label}</button>`).join('')}</div>
 ${zkLoading?'<div class="zk-block">جارٍ تحميل المكتبة المحلية…</div>':zkTab==='documents'?zkDocuments():zkTab==='ideas'?zkIdeas():zkTab==='drafts'?zkDrafts():zkTab==='import'?zkImportPanel():zkSettings()}
 <div class="zk-footer">لا يوجد ربط API أو مفتاح خدمة. PDF.js وTesseract.js (OCR عربي/إنجليزي) مكتبتان مجانيتان تُحمّلان عند الحاجة. يتم التعرف على الصور محلياً في المتصفح. أول استخدام يتطلب إنترنت؛ معالجة مئات الصفحات المصوّرة قد تستغرق وقتاً طويلاً حسب جهازك. لا تُضاف المسودات لقوالب CRM إلا بموافقة المدير.</div>
 </div>`;}

function migrateLegacyStages(data){
 if(!data||!Array.isArray(data.clients))return false;
 let changed=false;
 for(const c of data.clients){
  if(LEGACY_STAGE_MAP[c.stage]){
   const previous=c.stage;
   c.stage=LEGACY_STAGE_MAP[previous];
   // Keep the previous label in backup metadata, not as a selectable stage.
   c.legacyStageBeforeSimplification??=previous;
   c.stageHistory??=[];
   c.stageHistory.unshift({from:previous,to:c.stage,by:'تحديث النظام',at:new Date().toISOString(),migration:true});
   changed=true;
  }else if(!STAGES.includes(c.stage)){
   c.legacyStageBeforeSimplification??=String(c.stage||'');
   c.stage='جديد';changed=true;
  }

  if(c.dealPhase==='qualification'||c.dealPhase==='proposal'||c.dealPhase==='negotiation'){c.dealPhase='qualified';changed=true}
  if(c.dealPhase==='lead'){c.dealPhase='lead';}
 }

 return changed;
}

const contractValidDate = value => {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||'')))return false;
  const dt=new Date(value+'T12:00:00Z');return !Number.isNaN(dt.getTime())&&dt.toISOString().slice(0,10)===value;
};
const contractTouchType = a => /^(مكالمة|واتساب|اجتماع|زيارة|رسالة واردة|رسالة واتساب مسجلة يدوياً|اتصال)/.test(String(a.type||'')) && !/لم يرد|بلا رد/.test(String(a.outcome||''));
const contractFirstDate = c => {
  const dates=DB.activities.filter(a=>a.client===c.id&&contractTouchType(a)&&contractValidDate(a.date)).map(a=>a.date);
  if(contractValidDate(c.firstContactAt))dates.push(c.firstContactAt);
  return dates.sort()[0]||'';
};
const contractCloseDate = c => {
  if(contractValidDate(c.wonAt))return c.wonAt;
  const stageEvents=(c.stageHistory||[]).filter(e=>e.to==='تعاقد'&&!e.migration&&typeof e.at==='string').map(e=>e.at.slice(0,10)).filter(contractValidDate).sort();
  return stageEvents[0]||'';
};
const contractDays = c => {
  const start=contractFirstDate(c),end=contractCloseDate(c);
  if(!start||!end||start>end)return null;
  return Math.round((Date.parse(end+'T12:00:00Z')-Date.parse(start+'T12:00:00Z'))/86400000);
};
const contractDurationBucket = c => {
  const d=contractDays(c);return d===null?'غير مكتمل':d<=7?'0–7 أيام':d<=14?'8–14 يوماً':d<=30?'15–30 يوماً':'أكثر من 30 يوماً';
};
const contractReasonSummary = cs => {
 const m=new Map();for(const c of cs){const label=String(c.winReason||'غير موثّق').trim()||'غير موثّق';m.set(label,(m.get(label)||0)+1)}

const contractPlacePart=(v,fallback)=>String(v||'').replace(/\s+/g,' ').trim()||fallback;

const contractRegionLabel=key=>{try{const [city,district]=JSON.parse(key);return district+' — '+city}catch{return 'منطقة غير محددة'}};
const contractAreaSummary=cs=>{
 const m=new Map();
 for(const c of cs){const key=contractRegionKey(c),existing=m.get(key);if(existing)existing.count++;else m.set(key,{key,label:contractRegionLabel(key),count:1,areaKnown:contractDistrictOf(c)!=='منطقة غير محددة'});}

 return [...m.values()].map(r=>({...r,prospects:prospects.filter(c=>contractRegionKey(c)===r.key).length})).sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'ar'));

function coachQuestionsPanel(){

on value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div id="coachAdvice" style="margin-top:15px">${coachAdvice(null)}</div><div class="helperbox" style="margin-top:17px">اختَر الأسئلة المناسبة للمحادثة ولا تسأل كل الأسئلة دفعة واحدة. تسجيل إجابات التجار الفعلية يتم داخل سجل التواصل وليس في دليل الأسئلة العام.</div></aside></div>`;

function coachMarketingPanel(){
 if(!STAGES.includes(coachStage))coachStage=STAGES[0];
 const template=stageTemplate(coachStage),c=assigned().find(x=>x.id===coachMerchant)||null;
 const preview=template?(c?stageMessageFill(template,c):template):'';

رحلة.'}</div></div><div class="actions" style="margin-top:14px"><button class="btn outline" onclick="coachCopyStage()">${ic('copy')} نسخ النص</button>${c&&c.stage===coachStage?`<button class="btn ghost" onclick="stageCompose('${c.id}')">فتح مسودة التاجر</button>`:''}</div><div class="notice" style="margin-top:15px">وجود رقم هاتف لا يعني موافقة على التسويق. لا تُرسل رسائل تلقائياً، واحترم رفض المتابعة. مرحلة «مرفوض» لا تسمح بإعادة الاستهداف دون موافقة مناسبة.</div></aside></div>`;
}
function coach(){coachEnsureData();return`${sectionHeader('مساعد المبيعات','دليل أسئلة وإجابات موحّد، ورسائل تسويقية لكل مرحلة بإدارة المدير.') }<div class="coach-hero"><div class="coach-switch"><button class="${coachPane==='questions'?'active':''}" onclick="coachSwitch('questions')">${ic('book')} دليل الأسئلة والإجابات</button><button class="${coachPane==='messages'?'active':''}" onclick="coachSwitch('messages')">${ic('message')} رسائل المراحل الخمس</button></div><span class="coach-pill">${isManager()?'صلاحية المدير: إدارة المحتوى':'صلاحية الموظف: العرض والنسخ'}</span></div>${coachPane==='questions'?coachQuestionsPanel():coachMarketingPanel()}`}

window.coachCancelQuestion=()=>{coachEditId='';render()};
window.coachSaveQuestion=e=>{
 e.preventDefault();if(!isManager())return toast('التعديل متاح للإدارة فقط');coachEnsureData();
 const data=dataForm(e),title=String(data.title||'').trim(),question=String(data.question||'').trim(),answer=String(data.answer||'').trim(),note=String(data.note||'').trim();
 if(!title||!question||!answer)return toast('اكتب العنوان والسؤال والإجابة');
 if(title.length>90||question.length>1000||answer.length>2500||note.length>900)return toast('تجاوزت الحد المسموح للنص');
 const existing=DB.salesPlaybook.find(q=>q.id===coachEditId);
 if(existing)Object.assign(existing,{title,question,answer,note});else DB.salesPlaybook.push({id:'coach'+uid(),title,question,answer,note});
 const action=existing?'تعديل':'إضافة';coachEditId='';log(action+' سؤال في دليل المبيعات: '+title);render();toast('تم حفظ السؤال والإجابة');
};
window.coachRemoveQuestion=id=>{if(!isManager())return;const item=DB.salesPlaybook.find(q=>q.id===id);if(!item)return;if(!confirm('حذف السؤال «'+item.title+'» من الدليل؟'))return;DB.salesPlaybook=DB.salesPlaybook.filter(q=>q.id!==id);coachEditId='';log('حذف سؤال من دليل المبيعات: '+item.title);render();toast('تم حذف السؤال')};

window.coachCopyStage=()=>{const c=assigned().find(x=>x.id===coachMerchant);const text=stageTemplate(coachStage);if(!text.trim())return toast('لم تُحفظ رسالة لهذه المرحلة');copyText(c?stageMessageFill(text,c):text)};
function coachAdvice(c){let s=smart(c),t=c?DB.templates.find(t=>t.category===c.objection)||DB.templates[0]:null;return`<div class="tip"><b>${s.headline}</b><br>${s.tip}</div>${t?`<div class="guide" style="margin-top:12px"><h4>قالب مقترح: ${t.title}</h4><p>${fillTemplate(t.text,c)}</p><div class="actions" style="margin-top:14px">${iconButton('نسخ النص',`copyCoach('${c.id}','${t.id}')`,'outline','copy')}${iconButton('فتح واتساب',`openWA('${c.id}','${t.id}')`,'green','message')}</div></div>`:''}`}

function lexValidation(original,val){

function lexApply(){
 const root=document.getElementById('root');if(!root||!DB.uiVocabulary)return;
 const map=DB.uiVocabulary, keys=Object.keys(map).filter(k=>k && map[k] && k!==map[k]).sort((a,b)=>b.length-a.length);
 if(!keys.length)return;
 // Underlying select values must remain canonical even if their labels are renamed.
 const opts=root.querySelectorAll('option');
 opts.forEach(opt=>{const base=opt.textContent.trim();if(!opt.hasAttribute('value'))opt.value=base});
 const skip='script,style,input,textarea,code,pre,[contenteditable],#lexEditor,.store-title,.store-sub,.client-name,.activity-card2,.timeline-entry,.task-card2,.social-preview,.template-card .body';
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
   const parent=node.parentElement;if(!parent||parent.closest(skip))continue;
   let text=node.nodeValue, trimmed=text.trim();if(!trimmed)continue;
   let candidate=keys.find(k=>trimmed===k||trimmed.startsWith(k+' (') && /^\s*\(\d+\)$/.test(trimmed.slice(k.length)));
   if(!candidate)continue;
   let changed=map[candidate]+trimmed.slice(candidate.length);
   node.nodeValue=text.replace(trimmed,changed);
 }
 root.querySelectorAll('[placeholder],[title]').forEach(el=>{
   if(el.closest('#lexEditor'))return;
   for(const att of ['placeholder','title'])if(el.hasAttribute(att)){
     const val=el.getAttribute(att);if(Object.prototype.hasOwnProperty.call(map,val))el.setAttribute(att,map[val]);
   }
 });
}

function mkAnalysis(c){
  let notes=[],actions=[];let im=+c.impressions||0,cl=+c.clicks||0,le=+c.inquiries||0,q=+c.qualified||0,co=+c.contracts||0,sp=+c.spent||0;
  if(!im&&!le&&!sp){notes.push('لا توجد بيانات نتائج كافية حتى الآن.');actions.push('أدخل نتائج المنصة للفترة نفسها قبل الحكم على الإعلان.');}
  else{
    if(im>0&&cl===0){notes.push('هناك ظهور مسجّل دون نقرات؛ قد يحتاج الخطاف أو الجمهور أو موضع الإعلان إلى مراجعة.');actions.push('اختبر عنواناً أو صورة مختلفة مع إبقاء الهدف والجمهور ثابتين.');}
    else if(im>=500&&cl/im<.01){notes.push('معدل النقر أقل من 1% في هذا المثال؛ هذا تنبيه داخلي وليس معياراً عاماً لكل المنصات.');actions.push('راجع وضوح القيمة في أول 3 ثوانٍ واختبر نسخة إبداعية ثانية.');}
    if(cl>0&&le===0){notes.push('هناك نقرات بلا استفسارات مسجلة؛ راجع وجهة الإعلان وطريقة نسب محادثات واتساب.');actions.push('تحقق من رابط التواصل وسهولة بدء المحادثة وتسجيل مصدرها.');}
    if(le>=10&&q/le<.2){notes.push('أقل من 20% من الاستفسارات تم تأهيلهم وفق البيانات المدخلة؛ قد يكون الجمهور واسعاً أو الأسئلة غير مخصصة.');actions.push('أضف تأهيلاً لطيفاً: المحافظة، متوسط الشحنات، واحتياج التاجر.');}
    if(q>=5&&co===0){notes.push('توجد فرص مؤهلة دون عقود: قد تكون العقبة في الثقة أو العرض أو المتابعة؛ لا يمكن تحديد السبب من الأرقام وحدها.');actions.push('راجع أسباب الرفض الفعلية مع فريق المبيعات قبل تعديل الإعلان.');}
    if(co>0){notes.push('سُجّلت تعاقدات؛ افصل بين التوقيع والتفعيل وتحقق من مصدر كل فرصة.');actions.push('وثّق ما قاله التاجر عن سبب انضمامه قبل تكرار الرسالة الفائزة.');}
    if(sp>0&&le===0)notes.push('صُرفت ميزانية دون استفسارات مدخلة؛ تحقق أولاً من اكتمال التسجيل وليس من فشل الحملة بالضرورة.');
    if(!notes.length){notes.push('المؤشرات لا تكشف مشكلة محددة وفق القواعد الحالية.');actions.push('قارن نفس الجمهور والمواعيد بإعلان آخر قبل رفع الإنفاق.');}
  }
  return {notes,actions};
}

<div class="mk-two"><section class="panel"><div class="panel-title">الرسالة التي حققت أعلى نسبة تأهيل في العينة</div><p class="mk-copy">${best?mkSafe(best.title):'لم تُدخل بيانات كافية بعد.'}</p><p class="mk-small">${best?'نسبة التأهيل: '+mkP(best.qualified,best.inquiries)+' — قياس وصفي لا يثبت سبب الأداء.':'أدخل استفسارات وتأهيل التجار لكل حملة.'}</p><button class="btn small outline" onclick="mkSelectTab('results')">افحص الأسباب والفرضيات</button></section><section class="panel"><div class="panel-title">قاعدة القرار التسويقي</div><p class="mk-copy">لا توقف إعلاناً لأن الرسائل قليلة فقط، ولا تعتبره ناجحاً لأن النقرات كثيرة. راقب <b>التجار المؤهلين، والتعاقدات، والتفعيل</b> مع تكلفة كل مرحلة.</p><p class="mk-small">تحديد سبب النجاح والفشل يحتاج إلى ملاحظات المبيعات ومقارنة عادلة، وليس إلى الأرقام وحدها.</p></section></div>
<div class="panel"><div class="panel-head"><div><div class="panel-title">الحملات الحالية</div><div class="panel-sub">ملخص الإنفاق والأداء</div></div><button class="btn small outline" onclick="mkSelectTab('campaigns')">جميع الحملات</button></div><div class="mk-campaign-grid">${DB.marketing.campaigns.slice(0,3).map(mkCampaignMini).join('')}</div></div>`}
function mkEditorCampaign(id){let c=id==='new'?{title:'',channel:'فيسبوك',objective:'استفسارات تجار مؤهلين',audience:'',geo:'',start:mkToday(),end:mkAddDays(mkToday(),14),budget:0,spent:0,impressions:0,clicks:0,inquiries:0,qualified:0,meetings:0,contracts:0,activated:0,hook:'',cta:'',notes:'',status:'مخططة'}:mkCam(id);if(!c)return'';return`<section class="panel" id="mk-editor"><div class="panel-title">${id==='new'?'إنشاء حملة تسويقية':'تعديل الحملة ونتائجها'}</div><p class="mk-small">تُدخل النتائج يدوياً من المنصة. يجب أن تكون جميع الأرقام للفترة الزمنية نفسها.</p><form onsubmit="mkSaveCampaign(event,'${id}')"><div class="fields">${mkInput('اسم الحملة','title',c.title,'text',true)}${mkSelect('القناة','channel',MK_CHANNELS,c.channel)}${mkSelect('الحالة','status',['مخططة','جارية','مكتملة','متوقفة'],c.status)}${mkInput('الهدف','objective',c.objective,'text',true)}${mkInput('الجمهور المستهدف','audience',c.audience)}${mkInput('المنطقة / المحافظات','geo',c.geo)}${mkInput('تاريخ البداية','start',c.start,'date')}${mkInput('تاريخ النهاية','end',c.end,'date')}${mkInput('الميزانية بالدينار','budget',c.budget,'number')}${mkInput('الإنفاق الفعلي','spent',c.spent,'number')}${mkInput('مرات الظهور','impressions',c.impressions,'number')}${mkInput('النقرات','clicks',c.clicks,'number')}${mkInput('الاستفسارات','inquiries',c.inquiries,'number')}${mkInput('تجار مؤهلون','qualified',c.qualified,'number')}${mkInput('اجتماعات','meetings',c.meetings,'number')}${mkInput('تعاقدات','contracts',c.contracts,'number')}${mkInput('تجار مفعّلون','activated',c.activated,'number')}${mkTextArea('الهوك / الفكرة الإعلانية','hook',c.hook)}${mkTextArea('الدعوة لاتخاذ إجراء CTA','cta',c.cta)}${mkTextArea('ملاحظات التسويق: الأسباب المرصودة لا التخمينات','notes',c.notes)}</div><div class="mk-buttons"><button type="submit" class="btn coral">حفظ الحملة</button><button type="button" class="btn outline" onclick="mkCancel()">إلغاء</button></div></form></section>`}
function mkCampaigns(){let list=DB.marketing.campaigns.filter(c=>mkCampaignFilter==='all'||c.channel===mkCampaignFilter);return`<div class="mk-toolbar">${isManager()?'<button class="btn coral" onclick="mkStartEdit(\'campaign\',\'new\')">+ إنشاء حملة</button>':''}<select class="select" style="max-width:195px" onchange="mkFilterChannel(this.value)"><option value="all">جميع المنصات</option>${MK_CHANNELS.map(x=>`<option value="${x}" ${mkCampaignFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn outline" onclick="mkExport()">تصدير النتائج CSV</button></div>${mkEditing.startsWith('campaign:')?mkEditorCampaign(mkEditing.split(':')[1]):''}<div class="mk-campaign-grid">${list.map(c=>mkCampaignMini(c)).join('')||'<div class="mk-empty">لا توجد حملات في هذا الفلتر</div>'}</div>${isManager()?'<p class="mk-small">ملاحظة: رفع الأرقام لا يعني أن النظام متصل تلقائياً بمنصات Meta أو TikTok. القيم تدخل يدوياً بعد مراجعة Ads Manager.</p>':''}`}
function mkResults(){let list=DB.marketing.campaigns;let selected=mkEditing?(mkEditing.startsWith('campaign:')?mkEditing.split(':')[1]:mkEditing):DB.marketing.campaigns[0]?.id;let c=mkCam(selected);if(!c)return'<div class="mk-empty">أضف حملة أولاً</div>';let d=mkAnalysis(c),related=mkRelated(c.id);return`${mkEditing.startsWith('campaign:')?mkEditorCampaign(mkEditing.split(':')[1]):''}<div class="mk-toolbar"><label>اختر الحملة للتحليل</label><select class="select" style="max-width:380px" onchange="mkOpenReport(this.value)">${list.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${mkSafe(x.title)}</option>`).join('')}</select>${isManager()?`<button class="btn coral" onclick="mkStartEdit('campaign','${c.id}')">إدخال النتائج / تعديلها</button>`:''}</div><div class="mk-metrics four">${mkMetric('CTR نسبة النقر',mkP(c.clicks,c.impressions),'النقرات ÷ مرات الظهور')}${mkMetric('تكلفة الاستفسار',c.inquiries?mkMoney(c.spent/c.inquiries):'—','الإنفاق ÷ الاستفسارات')}${mkMetric('نسبة التأهيل',mkP(c.qualified,c.inquiries),'المؤهلون ÷ الاستفسارات')}${mkMetric('تكلفة التاجر المتعاقد',c.contracts?mkMoney(c.spent/c.contracts):'—','الإنفاق ÷ العقود')}</div><div class="mk-two"><section class="panel"><div class="panel-title">قراءة النتائج: ماذا نعرف؟</div>${d.notes.map(x=>`<div class="mk-reason">${mkSafe(x)}</div>`).join('')}<div class="mk-small">الاستنتاجات فرضيات تشخيصية تستلزم تحققاً، ولا تثبت سبب الأداء أو مقارنة عادلة تلقائياً.</div></section><section class="panel"><div class="panel-title">الإجراء المقترح القادم</div>${d.actions.map(x=>`<div class="mk-next">→ ${mkSafe(x)}</div>`).join('')}<div class="mk-small">القرار النهائي لمدير التسويق، ولا يُعدّل النظام الميزانية أو ينشر الإعلان من تلقاء نفسه.</div></section></div><div class="panel"><div class="panel-title">ملحوظات موثقة من الميدان</div><p class="mk-copy">${mkSafe(c.notes||'لا توجد ملاحظات مدخلة')}</p><div class="mk-small">تجار CRM المرتبطون بهذه الحملة: <b>${mkN(related.length)}</b> · عقود مرتبطة بسجلات التجار: <b>${mkN(related.filter(x=>x.stage==='تعاقد').length)}</b>. قد تختلف عن إحصاءات المنصة اليدوية، فلا تُجمع دون المطابقة.</div></div>`}
function mkPlanner(){let d=new Date(mkMonth+'-01T12:00:00'),year=d.getFullYear(),month=d.getMonth(),start=d.getDay(),days=new Date(year,month+1,0).getDate();let cells=[];for(let i=0;i<start;i++)cells.push('<div class="mk-day muted"></div>');for(let n=1;n<=days;n++){let date=mkMonth+'-'+String(n).padStart(2,'0');let tasks=DB.marketing.tasks.filter(t=>t.date===date);let cs=DB.marketing.campaigns.filter(c=>c.start===date||c.end===date);cells.push(`<div class="mk-day ${date===mkToday()?'today':''}"><b>${n}</b>${tasks.map(t=>`<div class="mk-event ${t.done?'done':''}" title="${mkSafe(t.title)}">${mkSafe(t.title)}</div>`).join('')}${cs.map(c=>`<div class="mk-event camp" title="${mkSafe(c.title)}">${mkSafe(c.title)} ${c.start===date?'بدء':'نهاية'}</div>`).join('')}</div>`)}return`<div class="mk-toolbar"><button class="btn outline" onclick="mkMonthMove(-1)">الشهر السابق</button><h3 style="margin:0">${d.toLocaleDateString('ar-IQ',{month:'long',year:'numeric'})}</h3><button class="btn outline" onclick="mkMonthMove(1)">الشهر التالي</button>${isManager()?'<button class="btn coral" onclick="mkStartEdit(\'task\',\'new\')">+ مهمة تسويقية</button>':''}</div>${mkEditing==='task:new'?mkTaskForm():''}<div class="mk-weekheads">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map(x=>`<span>${x}</span>`).join('')}</div><div class="mk-calendar">${cells.join('')}</div><div class="panel"><div class="panel-head"><div class="panel-title">قائمة تنفيذ الحملات</div><div class="mk-small">الأعمال القادمة والمسؤول عنها</div></div>${DB.marketing.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="mk-task"><button class="mk-check ${t.done?'done':''}" onclick="mkDoneTask('${t.id}')">${t.done?'✓':'○'}</button><div><b style="${t.done?'text-decoration:line-through;opacity:.5':''}">${mkSafe(t.title)}</b><small>${mkFmtDate(t.date)} · ${mkSafe(t.owner)} · ${mkSafe(mkCam(t.campaign)?.title||'غير مرتبط بحملة')}</small></div>${isManager()?`<button class="btn small ghost" onclick="mkDeleteTask('${t.id}')">حذف</button>`:''}</div>`).join('')||'<div class="mk-empty">لا توجد مهام بعد</div>'}</div>`}
function mkTaskForm(){return`<section class="panel" id="mk-editor"><div class="panel-title">مهمة تسويقية جديدة</div><form onsubmit="mkSaveTask(event)"><div class="fields">${mkInput('عنوان المهمة','title','','text',true)}${mkInput('موعد التنفيذ','date',mkToday(),'date')}${mkInput('المسؤول','owner','التسويق')}${mkSelect('النوع','type',['إبداع','إعلان','تحليل','مبيعات','اجتماع','تقرير'])}<div class="field"><label>الحملة ذات الصلة</label><select class="select" name="campaign">${mkCampaignOptions()}</select></div></div><div class="mk-buttons"><button class="btn coral">حفظ المهمة</button><button type="button" class="btn outline" onclick="mkCancel()">إلغاء</button></div></form></section>`}
function mkLeads(){let leads=assigned().filter(c=>c.socialLead||c.marketingCampaignId);let permitted=leads.filter(c=>c.marketingConsent==='yes'&&c.consentProof&&c.permission!=='لا يرغب');return`<div class="mk-leads-top"><div><h3>التجار القادمون من الإعلانات والمنصات</h3><p>اربط التاجر بحملة أو منصة بعد تحديد المصدر، واستعمل ملفه الأصلي في CRM للمتابعة.</p></div><button class="btn coral" onclick="go('social');socNav('import')">+ إضافة رقم تاجر</button></div><div class="mk-metrics four">${mkMetric('سجلات مكتشفة',mkN(leads.length),'تشمل أرقام المنصات')}${mkMetric('موافقة موثقة',mkN(permitted.length),'للتواصل التسويقي')}${mkMetric('تنتظر الموافقة',mkN(leads.filter(c=>c.marketingConsent!=='yes'&&c.permission!=='لا يرغب').length),'لا ترسل تسويقاً الآن')}${mkMetric('مرتبطة بحملة',mkN(leads.filter(c=>c.marketingCampaignId).length),'مصدر يدوي مسجّل')}</div><section class="panel"><div class="panel-title">ربط التجار بالحملة المناسبة</div><p class="mk-small">وجود رقم هاتف على صفحة عامة لا يعد موافقة على التسويق. افتح ملف التاجر وتأكد من مصدر الرقم والموافقة الموثقة قبل المراسلة.</p><div class="tablewrap"><table class="datatable"><thead><tr><th>التاجر</th><th>المصدر / النشاط</th><th>الموافقة</th><th>الحملة المسؤولة</th><th>إجراء</th></tr></thead><tbody>${leads.map(c=>`<tr><td><strong>${mkSafe(c.name)}</strong><small style="display:block;color:#8996aa">${mkSafe(c.phone)}</small></td><td>${mkSafe(c.source)} · ${mkSafe(c.category||'غير معروف')}</td><td>${c.marketingConsent==='yes'&&c.consentProof?'✓ موثقة':c.permission==='لا يرغب'?'لا يرغب':'غير موثقة'}</td><td><select class="select" onchange="mkAssignLead('${c.id}',this.value)">${mkCampaignOptions(c.marketingCampaignId||'')}</select></td><td><button class="btn small outline" onclick="openClient('${c.id}')">فتح الملف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد ملفات من المنصات. استخدم إضافة التجار من السوشيال.</td></tr>'}</tbody></table></div></section>`}
function mkContent(){return`${isManager()?'<div class="mk-toolbar"><button class="btn coral" onclick="mkStartEdit(\'content\',\'new\')">+ إضافة فكرة أو نص تسويقي</button><button class="btn outline" onclick="go(\'library\')">مكتبة ملفات زاجل</button></div>':'<p class="mk-small">المواد يعتمدها المدير قبل استخدامها.</p>'}${mkEditing==='content:new'?`<section class="panel" id="mk-editor"><div class="panel-title">إضافة نص للحملات</div><form onsubmit="mkSaveContent(event)"><div class="fields">${mkInput('عنوان الفكرة','label','')}${mkSelect('نوع المحتوى','type',['منشور / إعلان','كاروسيل','فيديو قصير','عرض مبيعات','رسالة توعية'])}${mkTextArea('الهوك','hook')}${mkTextArea('النص / السيناريو','body')}${mkTextArea('CTA','cta')}</div><div class="mk-buttons"><button class="btn coral">حفظ المحتوى</button><button type="button" class="btn outline" onclick="mkCancel()">إلغاء</button></div></form></section>`:''}<div class="mk-content-grid">${DB.marketing.content.map(x=>`<article class="mk-content-card"><div class="mk-small">${mkSafe(x.type)} · ${mkSafe(x.label)}</div><h3>${mkSafe(x.hook)}</h3><p>${mkSafe(x.body)}</p><footer><b>CTA: ${mkSafe(x.cta)}</b><div><button class="btn small outline" onclick="mkCopyContent('${x.id}')">نسخ</button>${isManager()?`<button class="btn small ghost" onclick="mkDeleteContent('${x.id}')">حذف</button>`:''}</div></footer></article>`).join('')}</div>`}
function mkTests(){return`${isManager()?`<div class="mk-toolbar"><button class="btn coral" onclick="mkStartEdit('test','new')">+ اختبار إعلاني A/B</button></div>`:''}${mkEditing==='test:new'?`<section class="panel" id="mk-editor"><div class="panel-title">إنشاء اختبار واضح الفرضية</div><form onsubmit="mkSaveTest(event)"><div class="fields"><div class="field"><label>الحملة</label><select class="select" name="campaign">${mkCampaignOptions()}</select></div>${mkInput('المؤشر الذي سنقيسه','success','تكلفة التاجر المؤهل')}${mkTextArea('الفرضية','hypothesis')}${mkTextArea('نسخة A','a')}${mkTextArea('نسخة B','b')}</div><div class="mk-buttons"><button class="btn coral">حفظ الاختبار</button><button type="button" class="btn outline" onclick="mkCancel()">إلغاء</button></div></form></section>`:''}<div class="mk-test-grid">${DB.marketing.tests.map(t=>`<section class="panel"><div class="mk-small">${mkSafe(mkCam(t.campaign)?.title||'بدون حملة')} · ${mkSafe(t.status)}</div><h3>${mkSafe(t.hypothesis)}</h3><div class="mk-two"><div class="mk-option"><b>A</b><p>${mkSafe(t.a)}</p></div><div class="mk-option"><b>B</b><p>${mkSafe(t.b)}</p></div></div><p class="mk-small">معيار المقارنة: ${mkSafe(t.success)}</p><div class="mk-reason">${mkSafe(t.result)}</div>${isManager()?`<button class="btn small outline" onclick="mkTestResult('${t.id}')">توثيق نتيجة الاختبار</button>`:''}</section>`).join('')}</div><p class="mk-small">تجربة A/B الجيدة تحتاج تغيير عنصر واحد قدر الإمكان، ومجموعتين قابلتين للمقارنة، ومدة وميزانية معقولتين. لا تعلن «النسخة الفائزة» عند نقص البيانات.</p>`}

function mkStrategy(){let p=DB.marketing.strategy;let actualQ=mkSum('qualified'),actualC=mkSum('contracts');return`<section class="panel"><div class="panel-head"><div><div class="panel-title">خطة التسويق للشهر</div><div class="panel-sub">الهدف والجمهور والميزانية ورسالة زاجل التسويقية في صفحة واحدة</div></div></div><form onsubmit="mkSaveStrategy(event)"><div class="fields">${mkInput('الشهر','period',p.period,'month')}${mkInput('الميزانية الشهرية د.ع','budget',p.budget,'number')}${mkInput('الهدف التجاري','goal',p.goal,'text',true)}${mkInput('الجمهور الأساسي','audience',p.audience,'text',true)}${mkInput('وعد الحملة / الرسالة','promise',p.promise,'text',true)}${mkInput('هدف التجار المؤهلين','qualifiedTarget',p.qualifiedTarget,'number')}${mkInput('هدف التعاقدات','contractsTarget',p.contractsTarget,'number')}${mkTextArea('أولويات التنفيذ','notes',p.notes)}</div>${isManager()?'<div class="mk-buttons"><button class="btn coral" type="submit">حفظ الخطة</button></div>':''}</form></section><div class="mk-metrics four">${mkMetric('الميزانية المخططة',mkMoney(p.budget),'مجموع ميزانيات الحملات: '+mkMoney(mkSum('budget')))}${mkMetric('هدف التأهيل',mkN(p.qualifiedTarget),'الحاصل: '+mkN(actualQ))}${mkMetric('هدف التعاقد',mkN(p.contractsTarget),'الحاصل: '+mkN(actualC))}${mkMetric('نسبة تنفيذ الصرف',mkP(mkSum('spent'),p.budget),'إنفاق مسجل من الميزانية')}</div><section class="panel"><div class="panel-title">خريطة الأسابيع الأربعة</div><div class="mk-plan-grid">${[['الأول','تجهيز العروض والمحتوى، مراجعة الاستهداف ومناطق الخدمة'],['الثاني','إطلاق النسخ الإعلانية واختبار الرسائل وتوثيق مصدر التاجر'],['الثالث','مراجعة جودة الاستفسارات مع المبيعات، تحسين القوالب والاستهداف'],['الرابع','تقييم تكلفة المتجر المؤهل والمتعاقد، وتوثيق أسباب النجاح والرفض']].map(([n,t])=>`<div class="mk-option"><b>الأسبوع ${n}</b><p>${t}</p></div>`).join('')}</div><p class="mk-small">المخرجات والحسابات في هذه الشاشة توضيحية حتى تُستبدل بخطة زاجل المعتمدة ونتائجها الفعلية.</p></section>`}

/* Deal journey is a sales conversation layer; contract/loss must be documented in acquisition operations. */
const DEAL_PHASES=[
 {id:'lead',title:'جديد',short:'جديد',desc:'أضيف إلى السجل',guidance:'تأكد من اسم المتجر ورقمه ومصدره.'},
 {id:'contacted',title:'تم التواصل',short:'تم التواصل',desc:'مكالمة أو محادثة موثّقة',guidance:'سجّل ما قاله التاجر وموعد المتابعة.'},
 {id:'qualified',title:'مؤهل',short:'مؤهل',desc:'احتياجه مناسب للخدمة',guidance:'حدد احتياج التاجر وقدّم عرضاً مناسباً ضمن المحادثة.'},
 {id:'won',title:'تعاقد',short:'تعاقد',desc:'اتفاق مع توثيق سبب الفوز',guidance:'توثيق سبب التعاقد من لوحة الاكتساب.'},
 {id:'lost',title:'مرفوض',short:'مرفوض',desc:'رفض مع توثيق السبب',guidance:'توثيق سبب الرفض من لوحة الاكتساب.'}
];
function dealOfficialPhase(c){if(c.stage==='مرفوض')return 'lost';if(c.stage==='تعاقد')return 'won';return null}
function dealPhase(c){const official=dealOfficialPhase(c);if(official)return official;return c.stage==='جديد'?'lead':c.stage==='تم التواصل'?'contacted':'qualified'}
function dealName(key){return DEAL_PHASES.find(s=>s.id===key)?.title||'غير محدد'}
function dealActor(id){return id==='manager'?'مدير المبيعات':repName(id)}
function dealPath(c, chosen, compact=false){
 const current=chosen||dealPhase(c),ind=DEAL_PHASES.findIndex(s=>s.id===current);
 const activeIdx=ind>=3?2:ind;
 const finalStatus=dealOfficialPhase(c);
 const stepHTML=DEAL_PHASES.slice(0,3).map((s,i)=>{
 const cls=i===activeIdx&&ind<3?'current':i<activeIdx||ind>=3?'done':'';
 return `<div class="deal-step ${cls}"><span class="deal-num">${i+1}</span><strong>${s.short}</strong><small>${s.desc}</small></div>`
 }).join('');
 const winner=current==='won'||finalStatus==='won'; const loser=current==='lost'||finalStatus==='lost';
 return `<section class="deal-track-card" aria-label="خط سير الصفقة"><div class="deal-track-head"><div><h3>خط سير صفقة التاجر</h3><p>جديد ← تم التواصل ← مؤهل ← نتيجة الصفقة</p></div><span class="deal-track-badge">${esc(dealName(current))}</span></div><div class="deal-path">${stepHTML}</div><div class="deal-endings"><div class="deal-ending ${winner?'won':''}"><strong>✓ تعاقد (Closed Won)</strong><span>${winner?'النتيجة معتمدة':'لم يُعتمد بعد'}</span></div><div class="deal-ending ${loser?'lost':''}"><strong>✕ مرفوض (Closed Lost)</strong><span>${loser?'النتيجة معتمدة':'لم يُغلق بالرفض'}</span></div></div><div class="deal-stage-note">مرحلة التاجر المعتمدة: <b>${esc(c.stage)}</b>. يوثّق الموظف موضع النقاش هنا، لكن اعتماد التعاقد أو الرفض يتم من لوحة الاكتساب.</div></section>`
}
function dealHistory(c){
 const events=[];
 (c.stageHistory||[]).forEach(h=>{if(!h.at)return;events.push({stamp:h.at,text:`انتقال من ${LEGACY_STAGE_MAP[h.from]||h.from||'مرحلة سابقة'} إلى ${LEGACY_STAGE_MAP[h.to]||h.to||'مرحلة جديدة'}`,by:h.by||'غير موثق',type:'مرحلة'})});
 DB.activities.filter(a=>a.client===c.id&&a.dealPhase).forEach(a=>events.push({stamp:(a.date||'')+'T'+(a.time||'00:00'),text:`${a.type} · ${dealName(a.dealPhase)}${a.outcome?' · '+a.outcome:''}`,by:dealActor(a.rep),type:'تواصل'}));
 events.sort((a,b)=>String(b.stamp).localeCompare(String(a.stamp)));
 return events.length?`<div class="deal-history-title">تاريخ تقدّم الصفقة <span class="tiny">(${events.length} حدث)</span></div><div class="deal-history">${events.slice(0,10).map(e=>`<div class="deal-history-event"><b>${esc(e.text)}</b><small>${esc(e.stamp.slice(0,16).replace('T',' · '))} · ${esc(e.by)}</small></div>`).join('')}</div>`:'<div class="deal-stage-note">يبدأ سجل انتقالات الصفقة بالظهور بعد توثيق التواصل أو تغيير المرحلة. السجلات القديمة التي لم تسجّل المرحلة لا يُفترض لها تاريخ.</div>'
}
function dealActivityCard(a){
 const phase=a.dealPhase?`<span class="tag orange">${esc(dealName(a.dealPhase))}</span>`:'<span class="tag">مرحلة غير موثّقة</span>';
 return `<article class="activity-card2 deal-contact"><div class="activity-card2-head"><div class="deal-contact-topline"><span class="tag blue">${esc(a.type)}</span>${phase}<span class="tag">${esc(dealActor(a.rep))}</span></div><time>${esc(a.date||'—')}${a.time?' · '+esc(a.time):''}</time></div><p>${esc(a.text)}</p>${a.outcome?`<span class="deal-outcome">نتيجة التواصل: ${esc(a.outcome)}</span>`:''}${a.nextAction?`<span class="deal-next">الخطوة القادمة: ${esc(a.nextAction)}${a.nextDate?' · '+esc(a.nextDate):''}</span>`:''}${a.fileId?`<button class="btn ghost small" style="margin-top:8px" onclick="downloadMaterial('${a.fileId}')">عرض التسجيل الصوتي</button>`:''}</article>`
}

 const ac=DB.activities.filter(a=>a.client===c.id).slice().reverse();

 const nextTask=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];
 const value=v=>esc((v===undefined||v===null||v==='')?'غير محدد':v);
 const info=(label,v,sub='')=>`<div class="profile-read-cell"><span>${label}</span><strong>${value(v)}</strong>${sub?`<small>${esc(sub)}</small>`:''}</div>`;
 const section=(name,content,desc='')=>`<section class="client-section-card profile-read-section"><div class="client-section-head"><div><h3>${name}</h3>${desc?`<p>${desc}</p>`:''}</div></div>${content}</section>`;

function extractNoteHints(c){let notes=[c.issue,c.notes,...DB.activities.filter(a=>a.client===c.id).slice(-3).map(a=>a.text)].filter(Boolean).join(' | ');let hints=[];let vol=notes.match(/(?:حوالي|تقريباً|تقريبا|نحو|أكثر من|عدد)?\s*(\d{1,4})\s*(?:طلب|طلبات|شحنة|شحنات)\s*(?:باليوم|يومياً|يوميا|كل يوم)/);

const terms=['يريد التوسع','توسع لمحافظة جديدة','مشكلة التسويات','تأخر المستحقات','شركة الحالية','مرتاح','المندوب','المرتجعات'];let found=terms.filter(t=>notes.includes(t));if(found.length)hints.push({field:'note',label:'كلمات من ملاحظات الموظف',value:found.join('، '),source:'نصوص مدخلة من الموظف'});
return hints}

function render(){
  const quietTheme = document.getElementById('zajel-minimal-ui');
  // Dashboard alone uses the preceding Curved Navigation / Interactive Hub styling.
  // All other pages keep Minimal Executive styling.
  if(quietTheme && quietTheme.sheet) quietTheme.sheet.disabled = !!(session && view==='dashboard');
  const oldRail=document.getElementById('zj-rail-scroll');
  const railY=oldRail?oldRail.scrollTop:(window.zjLastRailY||0);
  if(oldRail)window.zjLastRailY=railY;
  document.getElementById('root').innerHTML=session?layout():loginPage();
  // Visual entrance transitions are opt-in per route change; no flash on ordinary data edits.
  const zjmRoute = session ? `${session.id||session.name||'user'}:${view}` : 'login';
  if(window.__zjmLastRoute !== zjmRoute){
    window.__zjmLastRoute = zjmRoute;
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      const zjmTarget = document.querySelector(session ? '#root .content' : '#root .login');
      if(zjmTarget)zjmTarget.classList.add(session?'zjm-enter':'zjm-login-enter');
    }
  }
  if(session){
    lexApply();
    const rail=document.getElementById('zj-rail-scroll');
    if(rail){
      rail.scrollTop=railY;
      const current=rail.querySelector('.zj-navbutton.active');
      if(current){
        const a=current.getBoundingClientRect(),b=rail.getBoundingClientRect();
        if(a.top<b.top)rail.scrollTop-=b.top-a.top+5;
        else if(a.bottom>b.bottom)rail.scrollTop+=a.bottom-b.bottom+5;
      }
      window.zjLastRailY=rail.scrollTop;
    }
  }
};

(function installZajelDockTooltip(){
  let bubble = null, current = null;
  function getBubble(){
    if (!bubble){
      bubble = document.createElement('div');
      bubble.className='zajel-nav-tooltip';
      bubble.setAttribute('role','tooltip');
      document.body.appendChild(bubble);
    }
    return bubble;
  }
  function hide(){
    current=null;
    if (bubble){bubble.classList.remove('visible');}
  }
  function show(btn){
    if (!btn || !btn.isConnected) return;
    const label=btn.getAttribute('data-label');
    if(!label) return;
    const tip=getBubble();
    current=btn;
    tip.textContent=label;
    tip.classList.remove('visible');
    tip.style.left='0px';tip.style.top='0px';
    const box=btn.getBoundingClientRect();
    const w=tip.offsetWidth,h=tip.offsetHeight;
    let left=box.left+(box.width-w)/2;
    left=Math.min(Math.max(8,left),Math.max(8,window.innerWidth-w-8));
    let top=box.top-h-11;
    if(top<8) top=box.bottom+12;
    tip.style.left=left+'px';tip.style.top=top+'px';
    tip.classList.add('visible');
  }
  document.addEventListener('pointerover', function(e){
    const btn=e.target.closest?.('.topicon-btn');
    if(btn && btn!==current) show(btn);
  });
  document.addEventListener('pointerout', function(e){
    const btn=e.target.closest?.('.topicon-btn');
    if(btn && !btn.contains(e.relatedTarget)) hide();
  });
  document.addEventListener('focusin', function(e){
    const btn=e.target.closest?.('.topicon-btn');
    if(btn) show(btn);
  });
  document.addEventListener('focusout', function(e){
    if(e.target.closest?.('.topicon-btn')) hide();
  });
  document.addEventListener('click', function(){hide()}, true);
  document.addEventListener('keydown', function(e){if(e.key==='Escape')hide()});
  window.addEventListener('resize',hide);
  document.addEventListener('scroll',hide,true);
})();
